apiVersion: apps/v1
kind: Deployment
metadata:
  name: adminer
  namespace: java-demo
spec:
  replicas: 1

  selector:
    matchLabels:
      app: adminer

  template:
    metadata:
      labels:
        app: adminer

    spec:
      containers:
      - name: adminer
        image: adminer

        ports:
        - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: adminer-service
  namespace: java-demo
spec:
  selector:
    app: adminer

  ports:
  - port: 8080
    targetPort: 8080

  type: ClusterIP
  